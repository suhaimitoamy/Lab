name: Finalize D-LAB Entry Optimization and Pullback Stats

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-dlab-entry-pullback-backtest.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import locked D-LAB snapshot and append verified report only
        env:
          REPORT_B64: ""
        run: |
          set -euo pipefail
          SRC_COMMIT='cf2919647fec597a440fa2252fb2041bd7e02bcb'
          SRC_LAB_BLOB='1bad036de22ed720154bf14d32d9a7b0ff02b6fd'
          PROD_BASELINE_BLOB='d6e6d7c979dd5a852bddd9661bef0480caa2eb35'

          git fetch --no-tags https://github.com/suhaimitoamy/Indikator-trading-view.git "$SRC_COMMIT"
          test "$(git rev-parse FETCH_HEAD:Amy-SMC-D-LAB.pine)" = "$SRC_LAB_BLOB"
          test "$(git rev-parse FETCH_HEAD:Amy-SMC-D.pine)" = "$PROD_BASELINE_BLOB"
          git show FETCH_HEAD:Amy-SMC-D-LAB.pine > /tmp/Amy-SMC-D-LAB.base.pine
          cp /tmp/Amy-SMC-D-LAB.base.pine Amy-SMC-D-LAB.pine
          printf '%s' "$REPORT_B64" | base64 -d >> Amy-SMC-D-LAB.pine

          python - <<'PY'
          from pathlib import Path
          import hashlib
          base = Path('/tmp/Amy-SMC-D-LAB.base.pine').read_bytes()
          final = Path('Amy-SMC-D-LAB.pine').read_bytes()
          marker = b'// === FASE BACKTEST GABUNGAN: Entry Opt & Pullback'
          if marker not in final:
              raise SystemExit('phase marker missing')
          if final[:len(base)] != base:
              raise SystemExit('pre-existing D-LAB source changed before appended report')
          if b'// M15: K1 878/878 | 90.66% | 39.98% | +0.0146R | 15/15' not in base:
              raise SystemExit('locked K1-K6 result block missing')
          pullback = b"string amyPullback = amyPullbackDirection == BULLISH ? 'UP' : amyPullbackDirection == BEARISH ? 'DOWN' : 'WAIT'"
          if pullback not in base:
              raise SystemExit('cf29196 Pullback definition missing')
          blob_sha = hashlib.sha1(b'blob ' + str(len(base)).encode() + b'\0' + base).hexdigest()
          if blob_sha != '1bad036de22ed720154bf14d32d9a7b0ff02b6fd':
              raise SystemExit('source blob mismatch: ' + blob_sha)
          print('verified_source_blob=', blob_sha)
          print('append_only_bytes=', len(final) - len(base))
          PY

          git diff --check -- Amy-SMC-D-LAB.pine

      - name: Commit append-only phase report and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-dlab-entry-pullback-backtest.yml
          git add Amy-SMC-D-LAB.pine
          git commit -m "research: optimize K1 M15 TP and validate Pullback statistics"
          git push origin HEAD:main
